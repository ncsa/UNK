<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNK Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root {
    --bg: #0c0c1a; --panel: #1b1b33; --edge: #3d3d7a; --text: #f4f4ff; --dim: #9a9ac8;
    --gold: #ffd23f; --red: #e8343a; --blue: #3fa9ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12px/1.6 "Press Start 2P", monospace; }
  img { image-rendering: pixelated; }
  button { font: inherit; cursor: pointer; }
  .screen { display: none; min-height: 100%; }
  .screen.active { display: block; }

  /* ---------- splash screen ---------- */
  #splash { position: fixed; inset: 0; background: #000; display: none; cursor: pointer; }
  #splash.active { display: block; }
  #splash video { width: 100%; height: 100%; object-fit: contain; }
  #splash-hint { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; font-size: 12px;
    color: #fff; text-shadow: 2px 2px 0 #000; animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  /* ---------- select screen ---------- */
  #select { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; isolation: isolate; }
  /* Map.jpeg behind the menu, darkened so text stays readable; the screen is plain if it's missing. */
  #select::before { content: ""; position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(rgba(12, 12, 26, 0.6), rgba(12, 12, 26, 0.75)), url("/assets/map.jpeg") center / cover, var(--bg); }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 28px; margin: 8px 0; color: var(--gold); text-shadow: 3px 3px 0 var(--red); letter-spacing: 2px; }
  h2 { font-size: 12px; color: var(--dim); margin: 22px 0 10px; }
  #user { color: var(--dim); font-size: 10px; }
  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 24px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .card { background: var(--panel); border: 3px solid var(--edge); color: var(--text); padding: 8px;
    width: 150px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
  .card:hover { border-color: var(--dim); }
  .card.selected { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
  .card .portrait { width: 100%; aspect-ratio: 1; background: #000; object-fit: contain; }
  .card .name { font-size: 10px; }
  .card .meta { font-size: 8px; color: var(--dim); line-height: 1.8; }
  .stat { display: grid; grid-template-columns: 38px 1fr; align-items: center; gap: 4px; }
  .stat i { display: block; height: 6px; background: var(--gold); }
  #fight-btn { width: 100%; margin-top: 16px; font-size: 18px; padding: 14px 28px; background: var(--red); color: #fff;
    border: 3px solid #fff; box-shadow: 4px 4px 0 #000; }
  #fight-btn:disabled { opacity: .4; cursor: default; }
  /* Arena preview: pops in under the controls panel whenever the opponent changes. */
  .side { align-self: start; }
  #arena-preview { margin: 12px 0 0; background: var(--panel); border: 3px solid var(--edge); padding: 6px;
    box-shadow: 4px 4px 0 #000; transform-origin: left top; }
  #arena-preview.pop { animation: pop .18s steps(3, end); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  #arena-preview .frame { position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  #arena-preview img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  #arena-preview .unknown { position: absolute; inset: 0; display: none; place-items: center; font-size: 36px; color: var(--dim); }
  #arena-preview.random img { display: none; }
  #arena-preview.random .unknown { display: grid; }
  #arena-preview figcaption { font-size: 8px; color: var(--dim); margin-top: 6px; }
  #arena-preview figcaption b { color: var(--gold); font-weight: normal; }
  aside { background: var(--panel); border: 3px solid var(--edge); padding: 12px 14px; align-self: start; }
  aside h2 { margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 9px; }
  td { padding: 4px 2px; }
  td:last-child { text-align: right; color: var(--gold); }
  tr.me td { color: var(--blue); }
  .controls { font-size: 9px; color: var(--dim); line-height: 2; }
  .controls b { color: var(--text); font-weight: normal; }
  .arrow { font: bold 13px/1 system-ui, sans-serif; }
  .empty { color: var(--dim); font-size: 10px; }

  /* ---------- fight screen ---------- */
  #fight { position: fixed; inset: 0; background: #000; display: none; align-items: center; justify-content: center; }
  #fight.active { display: flex; }
  #canvas { image-rendering: pixelated; width: min(100vw, calc(100vh * 384 / 224)); aspect-ratio: 384 / 224;
    cursor: crosshair; }

  /* ---------- results screen ---------- */
  #results { max-width: 560px; margin: 0 auto; padding: 40px 16px; text-align: center; }
  #results h1 { font-size: 32px; }
  #result-score { font-size: 22px; color: var(--gold); margin: 18px 0 6px; }
  #result-detail { color: var(--dim); font-size: 10px; }
  #results aside { text-align: left; margin: 24px 0; }
  .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .buttons button { padding: 12px 18px; background: var(--panel); color: var(--text); border: 3px solid var(--edge); }
  .buttons button:first-child { background: var(--red); border-color: #fff; }
</style>
</head>
<body>

<section id="splash" class="screen active">
  <video id="splash-video" src="/assets/splash.mp4" playsinline preload="auto"></video>
  <div id="splash-hint"></div>
</section>

<section id="select" class="screen">
  <header><h1>UNK FIGHTER</h1><span id="user"></span></header>
  <div class="layout">
    <main>
      <h2>YOUR FIGHTER</h2>
      <div class="grid" id="player-grid"></div>
      <h2>CHOOSE YOUR OPPONENT</h2>
      <div class="grid" id="opponent-grid"></div>
    </main>
    <div class="side">
    <aside>
      <h2>HIGH SCORES</h2>
      <table id="scores-side"></table>
      <h2>CONTROLS</h2>
      <div class="controls">
        <b>A / D</b> move · hold back to block<br>
        <b>W</b> jump · <b>S</b> crouch<br>
        <b>J</b> or <b>click</b> punch<br>
        <b>K</b> or <b>right click</b> kick<br>
        <b>Esc</b> pause · <b>M</b> music · <b>N</b> sound effects (here or paused)<br>
        SPECIALS (<span class="arrow">→</span> = toward opponent)<br>
        <span id="special-help"></span>
      </div>
    </aside>
      <figure id="arena-preview" hidden>
        <div class="frame"><img alt=""><span class="unknown">?</span></div>
        <figcaption></figcaption>
      </figure>
      <button id="fight-btn" disabled>FIGHT!</button>
    </div>
  </div>
</section>

<section id="fight" class="screen">
  <canvas id="canvas" width="384" height="224"></canvas>
</section>

<section id="results" class="screen">
  <h1 id="result-title"></h1>
  <div id="result-score"></div>
  <div id="result-detail"></div>
  <aside><h2>HIGH SCORES</h2><table id="scores-results"></table></aside>
  <div class="buttons">
    <button id="rematch-btn">REMATCH</button>
    <button id="menu-btn">MAIN MENU</button>
  </div>
</section>

<script src="/static/sound.js"></script>
<script src="/static/game.js"></script>
</body>
</html>
